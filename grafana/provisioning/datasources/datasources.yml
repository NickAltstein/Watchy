apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: watchy_trading
    user: watchy
    secureJsonData:
      password: watchy_dev_password
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 300
    editable: true

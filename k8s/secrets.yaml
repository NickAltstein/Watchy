# Example secrets file - DO NOT commit actual secrets to git
# Create actual secrets using: kubectl create secret generic watchy-secrets --from-literal=key=value

apiVersion: v1
kind: Secret
metadata:
  name: watchy-secrets
  namespace: watchy
  labels:
    app.kubernetes.io/name: watchy
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials - REPLACE ALL VALUES IN PRODUCTION
  POSTGRES_USER: "watchy_user"
  POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
  
  # Redis password
  REDIS_PASSWORD: "<REDIS_PASSWORD>"
  
  # Application secrets - Use: openssl rand -base64 64
  SECRET_KEY: "<SECRET_KEY>"
  JWT_SECRET_KEY: "<JWT_SECRET_KEY>"
  
  # API keys
  OPENAI_API_KEY: "<OPENAI_API_KEY>"
  ANTHROPIC_API_KEY: "<ANTHROPIC_API_KEY>"
  
  # External services
  SMTP_PASSWORD: "<SMTP_PASSWORD>"
  GRAFANA_PASSWORD: "<GRAFANA_PASSWORD>"
  
  # Database URL (constructed from above)
  DATABASE_URL: "postgresql://watchy_user:<POSTGRES_PASSWORD>@postgres-service:5432/watchy_trading"
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-cert
  namespace: watchy
  labels:
    app.kubernetes.io/name: watchy
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Replace with actual base64-encoded TLS certificate and key
  # Generate with: kubectl create secret tls tls-cert --cert=path/to/cert.pem --key=path/to/key.pem --dry-run=client -o yaml
  tls.crt: <BASE64_ENCODED_CERTIFICATE>
  tls.key: <BASE64_ENCODED_PRIVATE_KEY>

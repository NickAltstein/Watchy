# Example secrets file - DO NOT commit actual secrets to git
# Create actual secrets using: kubectl create secret generic watchy-secrets --from-literal=key=value

apiVersion: v1
kind: Secret
metadata:
  name: watchy-secrets
  namespace: watchy
  labels:
    app.kubernetes.io/name: watchy
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials (base64 encode in production)
  POSTGRES_USER: "watchy_user"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis password
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Application secrets
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_RANDOM_STRING"
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_RANDOM_STRING"
  
  # API keys
  OPENAI_API_KEY: "sk-..."
  ANTHROPIC_API_KEY: "sk-ant-..."
  
  # External services
  SMTP_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Database URL (constructed from above)
  DATABASE_URL: "postgresql://watchy_user:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/watchy_trading"
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-cert
  namespace: watchy
  labels:
    app.kubernetes.io/name: watchy
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
stringData:
  # Replace with actual TLS certificate and key
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # Your TLS certificate here
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    # Your TLS private key here
    -----END PRIVATE KEY-----

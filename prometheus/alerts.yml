# Alert Rules for Watch Trading Platform
groups:
  - name: backend_alerts
    interval: 30s
    rules:
      # High error rate (> 1%)
      - alert: HighErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

      # High response time (p95 > 500ms)
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value | humanizeDuration }} (threshold: 500ms)"

      # Service down
      - alert: ServiceDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend service is down"
          description: "Backend service has been down for more than 1 minute"

  - name: database_alerts
    interval: 30s
    rules:
      # Database connections high (> 80%)
      - alert: HighDatabaseConnections
        expr: (pg_stat_database_numbackends / pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of database connections"
          description: "Database is using {{ $value | humanizePercentage }} of available connections (threshold: 80%)"

  - name: redis_alerts
    interval: 30s
    rules:
      # Redis memory usage high
      - alert: HighRedisMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanizePercentage }} of available memory"

  - name: celery_alerts
    interval: 30s
    rules:
      # Queue depth too high (> 5000)
      - alert: HighQueueDepth
        expr: celery_queue_length > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue depth is too high"
          description: "Queue has {{ $value }} pending tasks (threshold: 5000)"

  - name: cost_alerts
    interval: 60s
    rules:
      # API costs too high (> $100/hour)
      - alert: HighAPICosts
        expr: rate(ai_api_cost_total[1h]) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI API costs are too high"
          description: "Current API costs are ${{ $value | humanize }}/hour (threshold: $100/hour)"

  - name: data_ingestion_alerts
    interval: 60s
    rules:
      # No messages received in 5 minutes
      - alert: NoMessagesReceived
        expr: rate(whatsapp_messages_processed_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No WhatsApp messages received"
          description: "No messages have been processed in the last 5 minutes"

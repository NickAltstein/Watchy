# Prometheus Configuration for Watch Trading Platform
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'watchy-dev'
    environment: 'development'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # FastAPI Backend
  - job_name: 'backend'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          component: 'api'
    metrics_path: '/metrics'

  # PostgreSQL Exporter (if added)
  - job_name: 'postgres'
    static_configs:
      - targets: []
        # - postgres_exporter:9187
        labels:
          service: 'database'
          component: 'postgres'

  # Redis Exporter (if added)
  - job_name: 'redis'
    static_configs:
      - targets: []
        # - redis_exporter:9121
        labels:
          service: 'cache'
          component: 'redis'

  # Nginx Exporter (if added)
  - job_name: 'nginx'
    static_configs:
      - targets: []
        # - nginx_exporter:9113
        labels:
          service: 'proxy'
          component: 'nginx'

  # Node Exporter for system metrics (if added)
  - job_name: 'node'
    static_configs:
      - targets: []
        # - node_exporter:9100
        labels:
          service: 'system'
          component: 'node'

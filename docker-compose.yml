  # WhatsApp Listener Service
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watch-trading-whatsapp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - PYTHON_API_URL=http://api:8000
      - WATCHED_GROUPS=${WATCHED_GROUPS:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-10000}
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./logs:/app/logs
    networks:
      - watch-network
    command: node server.js

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: watch-trading-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./dash.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - api
    networks:
      - watch-network
    profiles:
      - with-nginx

  # Optional: Database Backup Service
  backup:
    image: alpine:latest
    container_name: watch-trading-backup
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./backups:/backups
    networks:
      - watch-network
    profiles:
      - with-backup
    command: >
      sh -c "while true; do
        cp /data/trade_desk.db /backups/trade_desk_$(date +%Y%m%d_%H%M%S).db;
        find /backups -type f -mtime +7 -delete;
        sleep 86400;
      done"

networks:
  watch-network:
    driver: bridge

volumes:
  data:
  logs:

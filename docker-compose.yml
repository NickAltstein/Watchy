version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: watchy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  scraper:
    build: .
    container_name: watchy-scraper
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_API_URL=http://localhost:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
      - ENABLE_HEALTH_SERVER=true
    volumes:
      - ./logs:/app/logs
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./trade_desk.db:/app/trade_desk.db
      - ./target_prices.json:/app/target_prices.json
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis-data:
    driver: local
